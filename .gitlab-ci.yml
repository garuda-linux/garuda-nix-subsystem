---
stages: [update, test, build, monthly]

image: alpine:latest
before_script:
  - . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
  - export TAG_NAME="$(nix eval --impure --raw --expr '(builtins.getFlake (toString ./. )).inputs.nixpkgs.lib.version' | cut -d. -f1,2)"

variables:
  GIT_AUTHOR_EMAIL: ci@garudalinux.org
  GIT_AUTHOR_NAME: Gitlab CI
  GIT_STRATEGY: clone
  GLAB_ENABLE_CI_AUTOLOGIN: "true"

update:
  stage: update
  tags: [nix]
  script:
    - nix flake update
    - nix flake update --flake ./internal/updater --inputs-from . --override-input nixpkgs "nixpkgs"
    - |
      if git diff --exit-code; then
        echo "No changes to flake.lock"
        exit 0;
      fi
    - |
      git config --global user.name "$GIT_AUTHOR_NAME"
      git config --global user.email "$GIT_AUTHOR_EMAIL"
    - git add flake.lock internal/updater/flake.lock
    - "git commit -m 'chore(flake.lock): bump flakes'"
    - git push "$CI_REPOSITORY_URL" HEAD:main
    - >
      nix run nixpkgs#curl -- -X POST
      -F "token=$CI_JOB_TOKEN"
      -F "ref=main"
      -F "variables[UPDATE]=false"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/trigger/pipeline"
  only:
    variables: [$UPDATE == "true"]
    refs: [main]

test:
  stage: test
  tags: [nix]
  script:
    - nix flake check
    - nix build .#internal.ci-bare -o result-bare
    - nix build .#internal.ci-full -o result-full
    # - nix build .#internal.boot-test.driver -o result-boot-test
    # - ./result-boot-test/bin/nixos-test-driver
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "merge_request"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $UPDATE != "true"'
      when: on_success
    - when: never

iso:
  stage: build
  tags: [nix]
  needs: [test]
  script:
    - nix build .#internal.iso-dr460nized -o result-dr460nized
    - nix build .#internal.iso-mokka -o result-mokka
    - mkdir -p tagged-isos
    - |
      for r in result-dr460nized result-mokka; do
        edition="${r#result-}"
        for iso in "$r"/iso/*.iso; do
          cp "$iso" "tagged-isos/garuda-nix-$edition-$TAG_NAME-x86_64-linux.iso"
        done
      done
    - ls -la tagged-isos
    - git tag -f "$TAG_NAME"
    # Remove the v2 tag once garuda-nix-subsystem no longer needs it
    - git tag -f v2
    - git push --atomic -f $CI_REPOSITORY_URL "$TAG_NAME" v2 HEAD:refs/heads/stable
    - nix run nixpkgs#glab -- release delete "$TAG_NAME" -y || true
    - nix run nixpkgs#glab -- release create "$TAG_NAME" --ref "$CI_COMMIT_SHA" --name "$TAG_NAME" --notes "Daily build $CI_COMMIT_SHA"
      tagged-isos/*.iso
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "merge_request"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $UPDATE != "true"'
      when: on_success
    - when: never

monthly:
  stage: monthly
  tags: [nix]
  needs: []
  script:
    - nix build .#internal.iso-dr460nized -o result-dr460nized
    - nix build .#internal.iso-mokka -o result-mokka
    - mkdir -p tagged-isos
    - |
      for r in result-dr460nized result-mokka; do
        edition="${r#result-}"
        for iso in "$r"/iso/*.iso; do
          cp "$iso" "tagged-isos/garuda-nix-$edition-$TAG_NAME-x86_64-linux.iso"
        done
      done
    - git fetch --tags "$CI_REPOSITORY_URL"
    - MONTHLY_TAG="monthly-$(date +%Y-%m)"
    - PREV_TAG="$(git tag --list 'monthly-*' --sort=-v:refname | head -n1 || true)"
    - nix develop -c monthly-release --prev-tag "$PREV_TAG" --new-tag "$MONTHLY_TAG" --output CHANGELOG.md
    - cat CHANGELOG.md
    - git tag "$MONTHLY_TAG"
    - git push "$CI_REPOSITORY_URL" "$MONTHLY_TAG"
    - |
      for iso in tagged-isos/*-"$TAG_NAME"-*.iso; do
        cp "$iso" "tagged-isos/$(basename "$iso" | sed "s/-$TAG_NAME-/-$MONTHLY_TAG-/")"
      done
    - |
      if [ -n "$PREV_TAG" ]; then
        nix run nixpkgs#glab -- release delete "$PREV_TAG" --with-tag -y || echo "No previous release $PREV_TAG to wipe"
      fi
    - nix run nixpkgs#glab -- release create "$MONTHLY_TAG" --ref "$CI_COMMIT_SHA" --name "$MONTHLY_TAG" -F CHANGELOG.md tagged-isos/*-"$MONTHLY_TAG"-*.iso
  artifacts:
    paths: [CHANGELOG.md]
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: never

---
stages: [update, test, build, monthly]

image: alpine:latest
before_script:
  - . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
  - export TAG_NAME="$(nix eval --impure --raw --expr '(builtins.getFlake (toString ./. )).inputs.nixpkgs.lib.version' | cut -d. -f1,2)"

variables:
  GIT_AUTHOR_EMAIL: ci@garudalinux.org
  GIT_AUTHOR_NAME: Gitlab CI
  GIT_STRATEGY: clone
  GLAB_ENABLE_CI_AUTOLOGIN: "true"

update:
  stage: update
  tags: [nix]
  script:
    - nix develop .#ci -c flake-update
  only:
    variables: [$UPDATE == "true"]
    refs: [main]

test:
  stage: test
  tags: [nix]
  script:
    - nix develop .#ci -c ci cheap
  rules:
    - when: on_success

heavy:
  stage: test
  tags: [nix]
  variables:
    NIX_CONFIG: "sandbox = false"
  script:
    - nix develop .#ci -c ci heavy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "merge_request"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $UPDATE != "true"'
      when: on_success
    - when: never

iso:
  stage: build
  tags: [nix]
  needs: [test, heavy]
  script:
    - nix develop .#release -c release-iso
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "merge_request"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $UPDATE != "true"'
      when: on_success
    - when: never

monthly:
  stage: monthly
  tags: [nix]
  needs: []
  script:
    - nix develop .#release -c release-monthly
  artifacts:
    paths: [CHANGELOG.md]
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: never
